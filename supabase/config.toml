# Supabase CLI configuration for local development (`supabase start`, requires Docker).
# Hosted projects: set the equivalent options in the Supabase dashboard (see docs/deployment.md).
project_id = "growth-os"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
# Lets prospects "Explore the demo" without registering (rate-limited in the app).
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true
